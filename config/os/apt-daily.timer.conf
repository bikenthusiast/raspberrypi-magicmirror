# Drop-in for apt-daily.timer (refresh package lists) -- docs/updates.md.
# Installed by scripts/setup-os-updates.sh to
#   /etc/systemd/system/apt-daily.timer.d/mirror.conf
#
# The default (06:00 and 18:00 plus up to 12 h random delay) often falls
# outside the Witty Pi window 07:30-22:15. Persistent=true from the unit
# still catches up a run missed while the Pi was off.
[Timer]
OnCalendar=
OnCalendar=*-*-* 10:00
RandomizedDelaySec=10min
