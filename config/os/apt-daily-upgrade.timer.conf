# Drop-in for apt-daily-upgrade.timer (unattended-upgrades) -- docs/updates.md.
# Installed by scripts/setup-os-updates.sh to
#   /etc/systemd/system/apt-daily-upgrade.timer.d/mirror.conf
#
# Half an hour after the package lists are refreshed, an hour and a half after
# the 09:00 deploy, well before the 22:15 power-off.
[Timer]
OnCalendar=
OnCalendar=*-*-* 10:30
RandomizedDelaySec=10min
